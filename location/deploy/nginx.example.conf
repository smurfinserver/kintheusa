# Inside the existing HTTPS server block for a dedicated location subdomain.
# This is a reviewable snippet, not an automatically installed DNS/TLS change.
location / {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    client_max_body_size 8k;
    proxy_read_timeout 60s;
    access_log off;
    error_log /dev/null;
}
